# Klon STM32F103C8T6 (CKS32 / CS32 / GD32 / APM32) icin OpenOCD ayari
# CubeIDE: Debug Configurations > Debugger > Debug probe: ST-LINK (OpenOCD)
#          Configuration Script: Manual spec. -> bu dosya

source [find interface/stlink-dap.cfg]
transport select dapdirect_swd

set WORKAREASIZE 0x5000
# Klon cipler farkli IDCODE donduruyor; 0 = IDCODE kontrolunu atla
set CPUTAPID 0

source [find target/stm32f1x.cfg]

adapter speed 1000
# NRST hatti bagli degilse yazilimsal reset (SYSRESETREQ) kullan
reset_config none
