# CubeIDE "STM32F103C8T6 OpenOCD Server" ayari bunu kullanir (GDB: localhost:3333)
source [file join [file dirname [info script]] clone_f103.cfg]
gdb_port 3333

# GDB flash'a yazmayi bitirince yeni vektor tablosuyla reset+halt
stm32f1x.cpu configure -event gdb-flash-write-end { reset halt }
# Debug oturumu bitince program calismaya devam etsin, OpenOCD kapansin
stm32f1x.cpu configure -event gdb-detach { resume; shutdown }
