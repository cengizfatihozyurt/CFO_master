# Render Blueprint: API servisi (veritabani Neon'da, Render disinda)
# Render paneli -> New -> Blueprint -> bu repoyu sec
# Not: Render'in ucretsiz Postgres'i 30 gunde silindigi icin veritabani 2026-11'de
# Neon'a (ucretsiz, kalici) tasindi. DATABASE_URL Neon baglanti adresidir.
services:
  - type: web
    name: stm32iot-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: API_KEY
        sync: false          # Render kurulumda soracak; ESP32'deki API_KEY ile ayni olmali
      - key: VIEW_KEY
        sync: false          # Istege bagli: panel icin sadece okuma sifresi (bos birakilabilir)
      - key: DATABASE_URL
        sync: false          # Neon -> Connect -> Connection string (Render panelinde girilir)
