# GDB'nin OpenOCD'yi pipe uzerinden kendisi baslatmasi icin
# ("STM32F103C8T6 Clone Debug" ayari bunu kullanir)
source [file join [file dirname [info script]] clone_f103.cfg]
gdb_port pipe
log_output C:/Users/Musa/STM32CubeIDE/workspace_2.2.0/STM32F103C8T6/Debug/openocd.log
# GDB flash'a yazmayi bitirince yeni vektor tablosuyla reset+halt
stm32f1x.cpu configure -event gdb-flash-write-end { reset halt }
